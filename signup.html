<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Apex Commercial Refrigeration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: { primary: { DEFAULT: '#0056b3', light: '#3385ff', dark: '#003d82' }, secondary: '#00bcd4', accent: '#ff5722', dark: { bg: '#0f172a', card: '#1e293b', alt: '#162032', border: '#334155' } },
          fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Outfit', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
</head>
<body class="bg-slate-100 dark:bg-dark-bg min-h-screen flex items-center justify-center p-4 antialiased transition-colors duration-300">

  <div class="w-full max-w-lg">
    <!-- Theme & RTL Toggles -->
    <div class="flex justify-end gap-2 mb-4">
      <button id="theme-toggle" class="p-2 w-10 h-10 flex items-center justify-center bg-white dark:bg-dark-card text-slate-600 dark:text-slate-300 rounded-full shadow-sm hover:shadow transition-all border border-slate-200 dark:border-dark-border" aria-label="Toggle Theme">
        <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i><i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
      </button>
      <button id="rtl-toggle" class="p-2 w-10 h-10 flex items-center justify-center bg-white dark:bg-dark-card text-slate-600 dark:text-slate-300 rounded-full shadow-sm hover:shadow transition-all border border-slate-200 dark:border-dark-border font-bold text-xs" aria-label="Toggle RTL"><i data-lucide="arrow-left-right" class="w-5 h-5"></i></button>
    </div>

    <!-- Signup Card -->
    <div class="bg-white dark:bg-dark-card rounded-2xl shadow-xl border border-slate-200 dark:border-dark-border p-8">
      <!-- Logo -->
      <a href="index.html" class="flex items-center justify-center gap-3 mb-6">
        <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center text-white shrink-0">
            <i data-lucide="snowflake" class="w-6 h-6"></i>
          </div>
          <span class="font-heading font-bold text-2xl text-slate-900 dark:text-white leading-tight">
            Apex
          </span>
      </a>

      <h1 class="text-2xl font-heading font-bold mb-2 text-center">Create Your Account</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 text-center mb-8">Set up your client portal to manage service requests</p>

      <form id="signup-form" novalidate class="space-y-5">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="firstName" class="block text-sm font-bold mb-2">First Name <span class="text-red-500">*</span></label>
            <input type="text" id="firstName" required class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-dark-border bg-white dark:bg-dark-alt focus:ring-2 focus:ring-primary outline-none transition-colors" placeholder="John">
            <p class="text-red-500 text-xs mt-1 hidden" id="firstName-error">Required.</p>
          </div>
          <div>
            <label for="lastName" class="block text-sm font-bold mb-2">Last Name <span class="text-red-500">*</span></label>
            <input type="text" id="lastName" required class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-dark-border bg-white dark:bg-dark-alt focus:ring-2 focus:ring-primary outline-none transition-colors" placeholder="Smith">
            <p class="text-red-500 text-xs mt-1 hidden" id="lastName-error">Required.</p>
          </div>
        </div>
        <div>
          <label for="companyName" class="block text-sm font-bold mb-2">Company Name</label>
          <input type="text" id="companyName" class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-dark-border bg-white dark:bg-dark-alt focus:ring-2 focus:ring-primary outline-none transition-colors" placeholder="ABC Restaurant">
        </div>
        <div>
          <label for="signup-email" class="block text-sm font-bold mb-2">Email <span class="text-red-500">*</span></label>
          <input type="email" id="signup-email" required class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-dark-border bg-white dark:bg-dark-alt focus:ring-2 focus:ring-primary outline-none transition-colors" placeholder="you@company.com">
          <p class="text-red-500 text-xs mt-1 hidden" id="signup-email-error">Valid email required.</p>
        </div>
        <div>
          <label for="signup-phone" class="block text-sm font-bold mb-2">Phone</label>
          <input type="tel" id="signup-phone" class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-dark-border bg-white dark:bg-dark-alt focus:ring-2 focus:ring-primary outline-none transition-colors" placeholder="(555) 123-4567">
        </div>
        <div>
          <label for="signup-password" class="block text-sm font-bold mb-2">Password <span class="text-red-500">*</span></label>
          <div class="relative">
            <input type="password" id="signup-password" required class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-dark-border bg-white dark:bg-dark-alt focus:ring-2 focus:ring-primary outline-none transition-colors pr-12" placeholder="Min. 8 characters">
            <button type="button" id="toggle-pw-1" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" aria-label="Toggle password visibility">
              <i data-lucide="eye" class="w-5 h-5 pw1-eye"></i><i data-lucide="eye-off" class="w-5 h-5 hidden pw1-eye-off"></i>
            </button>
          </div>
          <p class="text-red-500 text-xs mt-1 hidden" id="signup-password-error">Min. 8 characters required.</p>
        </div>
        <div>
          <label for="confirm-password" class="block text-sm font-bold mb-2">Confirm Password <span class="text-red-500">*</span></label>
          <div class="relative">
            <input type="password" id="confirm-password" required class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-dark-border bg-white dark:bg-dark-alt focus:ring-2 focus:ring-primary outline-none transition-colors pr-12" placeholder="Repeat password">
            <button type="button" id="toggle-pw-2" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" aria-label="Toggle confirm password visibility">
              <i data-lucide="eye" class="w-5 h-5 pw2-eye"></i><i data-lucide="eye-off" class="w-5 h-5 hidden pw2-eye-off"></i>
            </button>
          </div>
          <p class="text-red-500 text-xs mt-1 hidden" id="confirm-password-error">Passwords must match.</p>
        </div>
        <div class="flex items-start gap-2">
          <input type="checkbox" id="terms" required class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary mt-1">
          <label for="terms" class="text-sm text-slate-600 dark:text-slate-400">I agree to the <a href="#" class="text-primary font-medium hover:text-secondary">Terms & Conditions</a> and <a href="#" class="text-primary font-medium hover:text-secondary">Privacy Policy</a></label>
        </div>
        <p class="text-red-500 text-xs hidden" id="terms-error">You must agree to the terms.</p>
        
        <button type="submit" class="btn-primary w-full py-3 text-base">Create Account</button>
      </form>

      <div class="my-6 flex items-center">
        <div class="flex-1 border-t border-slate-200 dark:border-dark-border"></div>
        <span class="px-4 text-xs text-slate-400 uppercase font-bold">or sign up with</span>
        <div class="flex-1 border-t border-slate-200 dark:border-dark-border"></div>
      </div>
      <div class="flex justify-center gap-4">
        <button class="w-16 h-16 rounded-2xl border border-slate-200 dark:border-dark-border flex items-center justify-center bg-white dark:bg-dark-alt hover:bg-slate-50 dark:hover:bg-slate-800 hover:shadow-md hover:-translate-y-1 hover:border-primary transition-all duration-300" aria-label="Sign up with Google">
          <svg class="w-6 h-6" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        </button>
        <button class="w-16 h-16 rounded-2xl border border-slate-200 dark:border-dark-border flex items-center justify-center bg-white dark:bg-dark-alt hover:bg-slate-50 dark:hover:bg-slate-800 hover:shadow-md hover:-translate-y-1 hover:border-primary transition-all duration-300" aria-label="Sign up with Microsoft">
          <svg class="w-6 h-6" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
        </button>
        <button class="w-16 h-16 rounded-2xl border border-slate-200 dark:border-dark-border flex items-center justify-center bg-white dark:bg-dark-alt hover:bg-slate-50 dark:hover:bg-slate-800 hover:shadow-md hover:-translate-y-1 hover:border-primary transition-all duration-300" aria-label="Sign up with Apple">
          <svg class="w-6 h-6 fill-current text-slate-900 dark:text-white" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        </button>
      </div>

      <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
        Already have an account? <a href="login.html" class="text-primary font-bold hover:text-secondary">Sign In</a>
      </p>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    lucide.createIcons();
    
    // Password toggles
    document.getElementById('toggle-pw-1')?.addEventListener('click', () => {
      const inp = document.getElementById('signup-password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      document.querySelector('.pw1-eye').classList.toggle('hidden');
      document.querySelector('.pw1-eye-off').classList.toggle('hidden');
    });
    document.getElementById('toggle-pw-2')?.addEventListener('click', () => {
      const inp = document.getElementById('confirm-password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      document.querySelector('.pw2-eye').classList.toggle('hidden');
      document.querySelector('.pw2-eye-off').classList.toggle('hidden');
    });
    
    // Signup validation
    document.getElementById('signup-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;
      document.querySelectorAll('[id$="-error"]').forEach(el => el.classList.add('hidden'));
      
      if (!document.getElementById('firstName').value.trim()) { document.getElementById('firstName-error').classList.remove('hidden'); valid = false; }
      if (!document.getElementById('lastName').value.trim()) { document.getElementById('lastName-error').classList.remove('hidden'); valid = false; }
      const emailVal = document.getElementById('signup-email').value;
      if (!emailVal.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) { document.getElementById('signup-email-error').classList.remove('hidden'); valid = false; }
      const pw = document.getElementById('signup-password').value;
      if (pw.length < 8) { document.getElementById('signup-password-error').classList.remove('hidden'); valid = false; }
      if (pw !== document.getElementById('confirm-password').value) { document.getElementById('confirm-password-error').classList.remove('hidden'); valid = false; }
      if (!document.getElementById('terms').checked) { document.getElementById('terms-error').classList.remove('hidden'); valid = false; }
      
      if (valid) { window.location.href = 'dashboard.html'; }
    });
  </script>
</body>
</html>
