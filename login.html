<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Login | Apex Commercial Refrigeration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: { primary: { DEFAULT: '#0056b3', light: '#3385ff', dark: '#003d82' }, secondary: '#0056b3', accent: '#0056b3', dark: { bg: '#0f172a', card: '#1e293b', alt: '#162032', border: '#334155' } },
          fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Outfit', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
</head>
<body class="bg-slate-100 dark:bg-dark-bg min-h-screen flex items-center justify-center p-4 antialiased transition-colors duration-300">

  <div class="w-full max-w-md">
    <!-- Theme & RTL Toggles -->
    <div class="flex justify-end gap-2 mb-4">
      <button id="theme-toggle" class="p-2 w-10 h-10 flex items-center justify-center bg-white dark:bg-dark-card text-slate-600 dark:text-slate-300 rounded-full shadow-sm hover:shadow transition-all border border-slate-200 dark:border-dark-border" aria-label="Toggle Theme">
        <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
      </button>
      <button id="rtl-toggle" class="p-2 w-10 h-10 flex items-center justify-center bg-white dark:bg-dark-card text-slate-600 dark:text-slate-300 rounded-full shadow-sm hover:shadow transition-all border border-slate-200 dark:border-dark-border font-bold text-xs" aria-label="Toggle RTL">
        <i data-lucide="arrow-left-right" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Login Card -->
    <div class="bg-white dark:bg-dark-card rounded-2xl shadow-xl border border-slate-200 dark:border-dark-border p-8">
      <!-- Logo -->
      <a href="index.html" class="flex items-center justify-center gap-3 mb-6">
        <div class="w-10 h-10 bg-primary rounded-lg flex items-center justify-center text-white shrink-0">
            <i data-lucide="snowflake" class="w-6 h-6"></i>
          </div>
          <span class="font-heading font-bold text-2xl text-slate-900 dark:text-white leading-tight">
            Apex
          </span>
      </a>
      
      <h1 class="text-2xl font-heading font-bold mb-2 text-center">Welcome Back</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 text-center mb-8">Sign in to your client dashboard</p>

      <form id="login-form" novalidate class="space-y-5">
        <div>
          <label for="login-email" class="block text-sm font-bold mb-2">Email Address</label>
          <input type="email" id="login-email" required class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-dark-border bg-white dark:bg-dark-alt focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-colors" placeholder="you@company.com">
          <p class="text-red-500 text-xs mt-1 hidden" id="login-email-error">Please enter a valid email address.</p>
        </div>
        <div>
          <label for="login-password" class="block text-sm font-bold mb-2">Password</label>
          <div class="relative">
            <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-lg border border-slate-300 dark:border-dark-border bg-white dark:bg-dark-alt focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-colors pr-12" placeholder="••••••••">
            <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" aria-label="Toggle password visibility">
              <i data-lucide="eye" class="w-5 h-5" id="eye-icon"></i>
              <i data-lucide="eye-off" class="w-5 h-5 hidden" id="eye-off-icon"></i>
            </button>
          </div>
          <p class="text-red-500 text-xs mt-1 hidden" id="login-password-error">Password is required.</p>
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="remember-me" class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary">
            <span class="text-sm text-slate-600 dark:text-slate-400">Remember Me</span>
          </label>
          <a href="#" class="text-sm text-primary hover:text-secondary font-medium">Forgot Password?</a>
        </div>
        <button type="submit" class="btn-primary w-full py-3 text-base">
          Sign In
        </button>
      </form>

      <div class="my-6 flex items-center">
        <div class="flex-1 border-t border-slate-200 dark:border-dark-border"></div>
        <span class="px-4 text-xs text-slate-400 uppercase font-bold">or continue with</span>
        <div class="flex-1 border-t border-slate-200 dark:border-dark-border"></div>
      </div>

      <div class="flex justify-center gap-4">
        <button class="w-16 h-16 rounded-2xl border border-slate-200 dark:border-dark-border flex items-center justify-center bg-white dark:bg-dark-alt hover:bg-slate-50 dark:hover:bg-slate-800 hover:shadow-md hover:-translate-y-1 hover:border-primary transition-all duration-300" aria-label="Sign in with Google">
          <svg class="w-6 h-6 fill-current text-slate-900 dark:text-white" viewBox="0 0 24 24"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
        </button>
        <button class="w-16 h-16 rounded-2xl border border-slate-200 dark:border-dark-border flex items-center justify-center bg-white dark:bg-dark-alt hover:bg-slate-50 dark:hover:bg-slate-800 hover:shadow-md hover:-translate-y-1 hover:border-primary transition-all duration-300" aria-label="Sign in with Facebook">
          <svg class="w-6 h-6 fill-current text-slate-900 dark:text-white" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </button>
        <button class="w-16 h-16 rounded-2xl border border-slate-200 dark:border-dark-border flex items-center justify-center bg-white dark:bg-dark-alt hover:bg-slate-50 dark:hover:bg-slate-800 hover:shadow-md hover:-translate-y-1 hover:border-primary transition-all duration-300" aria-label="Sign in with Apple">
          <svg class="w-6 h-6 fill-current text-slate-900 dark:text-white" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        </button>
      </div>

      <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6 whitespace-nowrap">
        Don't have an account? <a href="signup.html" class="text-primary font-bold hover:text-secondary">Create Account</a>
      </p>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    lucide.createIcons();
    
    // Password visibility toggle
    const togglePw = document.getElementById('toggle-password');
    const pwInput = document.getElementById('login-password');
    const eyeIcon = document.getElementById('eye-icon');
    const eyeOffIcon = document.getElementById('eye-off-icon');
    
    if (togglePw) {
      togglePw.addEventListener('click', () => {
        const type = pwInput.getAttribute('type') === 'password' ? 'text' : 'password';
        pwInput.setAttribute('type', type);
        eyeIcon.classList.toggle('hidden');
        eyeOffIcon.classList.toggle('hidden');
      });
    }
    
    // Login form validation
    const loginForm = document.getElementById('login-form');
    if (loginForm) {
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        let valid = true;
        
        document.querySelectorAll('[id$="-error"]').forEach(el => el.classList.add('hidden'));
        
        const email = document.getElementById('login-email');
        const password = document.getElementById('login-password');
        
        if (!email.value.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
          document.getElementById('login-email-error').classList.remove('hidden');
          valid = false;
        }
        if (!password.value.trim()) {
          document.getElementById('login-password-error').classList.remove('hidden');
          valid = false;
        }
        
        if (valid) {
          window.location.href = 'dashboard.html';
        }
      });
    }
  </script>
</body>
</html>
